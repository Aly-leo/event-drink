<div class="d-flex" style="min-height: 100vh;">

  <!-- Sidebar (desktop) -->
  <aside class="ed-glass d-none d-md-flex flex-column border-end shadow-sm"
         style="width: 260px; flex-shrink: 0; height: 100vh; position: sticky; top: 0;">

    <div class="p-4 border-bottom">
      <h1 class="h4 fw-bold text-primary mb-3">Eventdrink</h1>
      <div class="d-flex align-items-center gap-2 p-2 bg-light rounded-3">
        <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center flex-shrink-0" style="width: 40px; height: 40px;">
          <i class="bi bi-shop"></i>
        </div>
        <div class="text-truncate">
          <div class="fw-semibold small text-truncate">{{ authService.currentUser()?.nom }}</div>
          <div class="text-secondary" style="font-size: 0.75rem;">Session Dépôt active</div>
        </div>
      </div>
    </div>

    <nav class="flex-grow-1 d-flex flex-column gap-1 p-3">
      @for (lien of liensNav; track lien.route) {
        <a
          [routerLink]="lien.route"
          routerLinkActive="active-nav-link"
          class="nav-link-custom d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-decoration-none text-secondary"
        >
          <i class="bi {{ lien.icone }} fs-5"></i>
          <span class="fw-semibold small">{{ lien.label }}</span>
        </a>
      }
    </nav>

    <div class="p-3 border-top d-flex flex-column gap-1">
      <a
        routerLink="/depot/compte"
        routerLinkActive="active-nav-link"
        class="nav-link-custom d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-decoration-none text-secondary"
      >
        <i class="bi bi-person fs-5"></i>
        <span class="fw-semibold small">Mon compte</span>
      </a>
      <button
        type="button"
        class="btn btn-link nav-link-custom d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-decoration-none text-danger text-start border-0"
        (click)="deconnexion()"
      >
        <i class="bi bi-box-arrow-right fs-5"></i>
        <span class="fw-semibold small">Déconnexion</span>
      </button>
    </div>
  </aside>

  <!-- Colonne principale -->
  <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">

    <header class="ed-glass d-flex justify-content-between align-items-center px-3 px-md-4 border-bottom sticky-top" style="height: 64px; top: 0; z-index: 30;">
      <h1 class="h5 fw-bold text-primary mb-0 d-md-none">Eventdrink</h1>
      <span class="d-none d-md-block"></span>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-light rounded-circle"><i class="bi bi-question-circle"></i></button>
        <button class="btn btn-sm btn-light rounded-circle position-relative">
          <i class="bi bi-bell"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">&nbsp;</span>
        </button>
        <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center d-md-none" style="width: 32px; height: 32px;">
          <i class="bi bi-person-fill"></i>
        </div>
      </div>
    </header>

    <main class="flex-grow-1" style="padding-bottom: 80px;">
      <router-outlet></router-outlet>
    </main>

  </div>

  <!-- Bottom nav (mobile) -->
  <nav class="ed-glass d-md-none fixed-bottom border-top d-flex justify-content-around py-2" style="z-index: 40;">
    @for (lien of liensNavMobile; track lien.route) {
      <a
        [routerLink]="lien.route"
        routerLinkActive="text-primary fw-bold"
        class="text-secondary text-center text-decoration-none"
      >
        <i class="bi {{ lien.icone }} d-block fs-5"></i>
        <span style="font-size: 0.65rem;">{{ lien.label }}</span>
      </a>
    }
  </nav>

</div>
