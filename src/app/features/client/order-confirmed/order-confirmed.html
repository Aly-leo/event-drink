<div class="d-flex flex-column align-items-center text-center py-5 px-3">
  <span
    class="d-inline-flex align-items-center justify-content-center rounded-circle mb-4"
    style="width: 72px; height: 72px; background: var(--ed-success); color: #fff;"
  >
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M20 6 9 17l-5-5" />
    </svg>
  </span>

  <h1 class="h4 fw-bold mb-2">Commande envoyée</h1>

  @if (commande(); as commande) {
    <p class="text-secondary mb-4">
      Ta commande a été envoyée au dépôt, tu seras notifié(e) dès sa confirmation.<br />
      Réf : <strong>{{ commande.referenceUnique }}</strong>
    </p>
  }

  <div class="d-flex flex-column gap-2" style="width: 100%; max-width: 320px;">
    <a [routerLink]="['/client/commandes', commandeId]" class="btn btn-primary">Suivre ma commande</a>
    <a routerLink="/client/explorer" class="btn btn-outline-secondary">Retour à l'accueil</a>
  </div>
</div>
