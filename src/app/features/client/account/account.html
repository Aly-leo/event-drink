<div class="container-fluid py-3" style="max-width: 480px;">
  <h1 class="h4 fw-bold text-primary mb-4">Mon compte</h1>

  @if (currentUser(); as user) {
    <div class="ed-card p-3 mb-4 d-flex align-items-center gap-3">
      <span
        class="d-inline-flex align-items-center justify-content-center rounded-circle fw-bold text-white flex-shrink-0"
        style="width: 56px; height: 56px; background: var(--ed-secondary); font-size: 1.2rem;"
      >
        {{ user.nom.slice(0, 2).toUpperCase() }}
      </span>
      <div>
        <div class="fw-bold">{{ user.nom }}</div>
        <div class="small text-secondary">{{ user.email }}</div>
        @if (user.telephone) {
          <div class="small text-secondary">{{ user.telephone }}</div>
        }
      </div>
    </div>

    <div class="d-flex flex-column gap-2">
      <a routerLink="/client/commandes" class="ed-card p-3 text-decoration-none text-body d-flex justify-content-between align-items-center">
        <span>Mes commandes</span>
        <span>→</span>
      </a>
    </div>

    <button type="button" class="btn btn-outline-danger w-100 mt-4" (click)="logout()">Se déconnecter</button>
  }
</div>
