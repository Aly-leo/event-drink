<div class="d-flex min-vh-100">
  <aside class="d-flex flex-column p-3 text-white" style="width: 260px; background: var(--ed-on-surface); flex-shrink: 0;">
    <div class="mb-4">
      <span class="h4 fw-bold text-white mb-0">Eventdrink</span>
      <div class="small text-white-50">Espace Admin</div>
    </div>

    <nav class="nav flex-column gap-1 flex-grow-1">
      <a
        class="nav-link text-white-50 rounded px-3 py-2"
        routerLink="dashboard"
        routerLinkActive="active bg-primary text-white"
      >
        Dashboard
      </a>
      <a
        class="nav-link text-white-50 rounded px-3 py-2"
        routerLink="catalogue"
        routerLinkActive="active bg-primary text-white"
      >
        Catalogue
      </a>
      <a
        class="nav-link text-white-50 rounded px-3 py-2"
        routerLink="plaintes"
        routerLinkActive="active bg-primary text-white"
      >
        Plaintes
      </a>
    </nav>

    <div class="border-top border-secondary pt-3 mt-3">
      <div class="small text-white-50 mb-2">{{ currentUser()?.nom }}</div>
      <button type="button" class="btn btn-sm btn-outline-light w-100" (click)="logout()">
        Se déconnecter
      </button>
    </div>
  </aside>

  <main class="flex-grow-1 overflow-auto">
    <router-outlet />
  </main>
</div>
