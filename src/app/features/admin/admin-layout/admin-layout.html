<div class="d-flex min-vh-100" style="background: var(--ed-surface);">
  <!-- Barre mobile : logo + hamburger, visible uniquement < lg -->
  <div
    class="d-flex d-lg-none align-items-center justify-content-between p-3 position-fixed top-0 start-0 w-100"
    style="z-index: 1030; background: var(--ed-surface-container-lowest); border-bottom: 1px solid var(--ed-border);"
  >
    <div class="d-flex align-items-center gap-2">
      <span
        class="d-inline-flex align-items-center justify-content-center rounded-3 fw-bold text-white"
        style="width: 32px; height: 32px; background: var(--ed-primary); font-size: 0.9rem;"
      >
        E
      </span>
      <span class="h5 fw-bold text-primary mb-0">Eventdrink</span>
    </div>
    <button
      type="button"
      class="btn btn-outline-secondary btn-sm"
      aria-label="Ouvrir le menu"
      (click)="toggleSidebar()"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 6h18" />
        <path d="M3 12h18" />
        <path d="M3 18h18" />
      </svg>
    </button>
  </div>

  <!-- Backdrop mobile, ferme la sidebar au clic -->
  @if (sidebarOpen()) {
    <div
      class="d-lg-none position-fixed top-0 start-0 w-100 h-100"
      style="background: rgba(11, 28, 48, 0.4); z-index: 1035;"
      (click)="closeSidebar()"
    ></div>
  }

  <aside
    class="admin-sidebar d-flex flex-column p-3 position-fixed top-0 start-0 h-100"
    [class.admin-sidebar--open]="sidebarOpen()"
    style="width: 260px; flex-shrink: 0; background: var(--ed-surface-container-lowest); border-right: 1px solid var(--ed-border); z-index: 1040; transition: transform 0.2s ease-in-out;"
  >
    <div class="d-flex align-items-center gap-2 mb-4 px-1">
      <span
        class="d-inline-flex align-items-center justify-content-center rounded-3 fw-bold text-white"
        style="width: 32px; height: 32px; background: var(--ed-primary); font-size: 0.9rem;"
      >
        E
      </span>
      <span class="h5 fw-bold text-primary mb-0">Eventdrink</span>
    </div>

    <nav class="nav flex-column gap-1 flex-grow-1">
      <a
        class="nav-link d-flex align-items-center gap-2 text-secondary rounded-pill px-3 py-2"
        routerLink="dashboard"
        routerLinkActive="bg-primary text-white"
        (click)="closeSidebar()"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="9" rx="1.5" />
          <rect x="14" y="3" width="7" height="5" rx="1.5" />
          <rect x="14" y="12" width="7" height="9" rx="1.5" />
          <rect x="3" y="16" width="7" height="5" rx="1.5" />
        </svg>
        Dashboard
      </a>
      <a
        class="nav-link d-flex align-items-center gap-2 text-secondary rounded-pill px-3 py-2"
        routerLink="catalogue"
        routerLinkActive="bg-primary text-white"
        (click)="closeSidebar()"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 7l9-4 9 4-9 4-9-4Z" />
          <path d="M3 7v10l9 4 9-4V7" />
          <path d="M12 11v10" />
        </svg>
        Catalogue
      </a>
      <a
        class="nav-link d-flex align-items-center gap-2 text-secondary rounded-pill px-3 py-2"
        routerLink="plaintes"
        routerLinkActive="bg-primary text-white"
        (click)="closeSidebar()"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 9v4" />
          <path d="M12 17h.01" />
          <path d="M10.29 3.86 1.82 18a1.5 1.5 0 0 0 1.3 2.25h17.76a1.5 1.5 0 0 0 1.3-2.25L13.71 3.86a1.5 1.5 0 0 0-2.42 0Z" />
        </svg>
        Plaintes
      </a>
    </nav>

    <div class="border-top pt-3 mt-3" style="border-color: var(--ed-border) !important;">
      <div class="small text-secondary mb-2">{{ currentUser()?.nom }}</div>
      <button type="button" class="btn btn-sm btn-outline-secondary w-100" (click)="logout()">
        Se déconnecter
      </button>
    </div>
  </aside>

  <main class="flex-grow-1 overflow-auto pt-5 pt-lg-0">
    <router-outlet />
  </main>
</div>
