name: Garder le backend Render eveille

on:
  schedule:
    # Toutes les 10 min : le tier gratuit de Render s'endort apres ~15 min
    # d'inactivite, ce ping l'empeche de s'endormir pendant les tests.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping le backend
        run: curl -sf -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" https://event-drink.onrender.com/ || true
