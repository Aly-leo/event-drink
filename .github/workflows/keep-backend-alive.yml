name: Garder le backend Render eveille

on:
  schedule:
    # Toutes les 10 min, mais seulement 7h-23h UTC : le tier gratuit de
    # Render a un quota d'heures mensuelles limite. Le faire tourner 24h/24
    # le consomme trop vite (et peut suspendre le service). On le garde
    # eveille pendant les heures de test/demo, pas la nuit.
    - cron: '*/10 7-23 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping le backend
        run: curl -sf -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" https://event-drink.onrender.com/ || true
