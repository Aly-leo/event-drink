name: Verifier que le backend Railway repond

on:
  schedule:
    # Railway ne met pas le service en veille comme le tier gratuit de
    # Render : ce ping n'est plus indispensable, garde juste un
    # monitoring leger pendant les heures de test/demo.
    - cron: '*/10 7-23 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping le backend
        run: curl -sf -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" https://event-drink-production.up.railway.app/ || true
